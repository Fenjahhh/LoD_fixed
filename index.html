<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daemon Hunter - Lane Battle Prototype V2</title>
  <style>
    :root {
      --bg: #10121c;
      --panel: #1a1f2e;
      --panel-2: #242b3d;
      --text: #ecf0ff;
      --muted: #a7b0ca;
      --accent: #7de2d1;
      --danger: #ff7a7a;
      --warn: #ffcc66;
      --good: #8cff98;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #090b12, var(--bg));
      color: var(--text);
      touch-action: manipulation;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px;
      background: rgba(10, 12, 20, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .pill {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .pill strong { color: var(--accent); }

    .buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
      position: relative;
      z-index: 20;
      pointer-events: auto;
    }

    button:active { transform: translateY(1px); }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #gameWrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #111522;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: linear-gradient(180deg, #12182a 0%, #182032 100%);
    }

    .overlay {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      z-index: 8;
    }

    .heroBar {
      background: rgba(10, 12, 20, 0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px;
      width: min(290px, 43vw);
      backdrop-filter: blur(2px);
    }

    .heroBar h3 {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 10px;
      width: 100%;
      background: #0b0f18;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .fill {
      height: 100%;
      width: 50%;
    }

    .hp { background: linear-gradient(90deg, #ff6767, #ff9f9f); }
    .mana { background: linear-gradient(90deg, #5c8dff, #86d7ff); }

    .bottomUI {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px;
      background: rgba(10, 12, 20, 0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
      position: relative;
      z-index: 25;
    }

    .skillRow, .shopRow {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      position: relative;
      z-index: 30;
    }

    .skill {
      min-width: 100px;
      text-align: center;
    }

    .skill small, .shopItem small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .shopItem {
      min-width: 145px;
      text-align: left;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      background: rgba(8, 10, 16, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 10px 14px;
      width: min(82vw, 520px);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 15;
      font-weight: 700;
    }

    .message.show { opacity: 1; }

    .help {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (min-width: 900px) {
      .bottomUI {
        grid-template-columns: 1.2fr 1fr;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="stats" id="stats"></div>
      <div class="buttons">
        <button id="levelBtn">Level wechseln</button>
        <button id="restartBtn">Neustart</button>
      </div>
    </div>

    <div id="gameWrap">
      <canvas id="game"></canvas>

      <div class="overlay">
        <div class="heroBar">
          <h3>Dein Dämon</h3>
          <div class="bar"><div class="fill hp" id="playerHpFill"></div></div>
          <div class="bar"><div class="fill mana" id="playerManaFill"></div></div>
          <div id="playerText" class="help"></div>
        </div>
        <div class="heroBar">
          <h3>Gegnerischer Dämon</h3>
          <div class="bar"><div class="fill hp" id="enemyHpFill"></div></div>
          <div class="bar"><div class="fill mana" id="enemyManaFill"></div></div>
          <div id="enemyText" class="help"></div>
        </div>
      </div>

      <div class="message" id="message"></div>
    </div>

    <div class="bottomUI">
      <div>
        <div class="skillRow" id="skills"></div>
        <div class="help" style="margin-top: 8px;">
          Desktop: Q / W / E / R oder Buttons. Klicken setzt ein Ziel, gedrückt halten/ziehen bewegt live. <br>
          Mobile: Tippen oder ziehen im Feld. Beide Dämonen bewegen sich frei im ganzen Rechteck.
        </div>
      </div>
      <div>
        <div class="shopRow" id="shop"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
